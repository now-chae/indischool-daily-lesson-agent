[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lesson-agent"
version = "0.1.0"
description = "Configurable daily lesson material assistant for teachers"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "keyring>=25",
  "lxml>=5",
  "openai>=2",
  "playwright>=1.50",
  "pydantic==2.13.4",
  "pydantic-settings>=2.7",
  "python-hwpx==4.1.1",
  "streamlit==1.60.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.22"]

[project.scripts]
lesson-agent = "lesson_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
